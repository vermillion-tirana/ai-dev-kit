name: CI

# TRIGGER NARROWED 2026-08-18 — `pull_request:` removed.
#
# The org exhausted its GitHub Free Actions allowance on 2026-08-17 (2,000
# minutes/month shared across 68 private repos). A job that cannot start still
# reports a RED check, so a PR trigger fails every PR having examined nothing.
# The same ruff commands now run locally on pre-push via
# scripts/hooks/pre-push-ci.sh, which is strictly earlier than a PR check.
#
# Restore `pull_request: branches: [main]` when the allowance resets if a
# server-side backstop is wanted; the local hook does not depend on it.
on:
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      
      - name: Run ruff check
        run: |
          uvx ruff check \
            --select=E,F,B,PIE \
            --ignore=E401,E402,F401,F403,B017,B904,ANN,TCH \
            --line-length=120 \
            --target-version=py311 \
            databricks-tools-core/ databricks-mcp-server/ .test/src/

      - name: Check formatting
        run: |
          uvx ruff format --check \
            --line-length=120 \
            --target-version=py311 \
            databricks-tools-core/ databricks-mcp-server/ .test/src/

  validate-skills:
    name: Validate Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: pip install pyyaml
      
      - name: Validate skill structure
        run: python .github/scripts/validate_skills.py

